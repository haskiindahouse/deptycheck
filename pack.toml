################
### Settings ###
################

[idris2]
url = "file:///home/developer/models/auto-improve/idris2-call-by-need-speed"
commit = "ca73c33ee8333779ca01614e2c21f665bc9f28c5"

[install]
whitelist = [ "deptycheck-docs", "pil-fun", "pil-dyn" ]

#######################
### Elab-util-extra ###
#######################

[custom.all.elab-util-extra]
type = "local"
path = "elab-util-extra"
ipkg = "elab-util-extra.ipkg"
test = "tests/tests.ipkg"

##################
### DepTyCheck ###
##################

[custom.all.deptycheck]
type = "local"
path = "."
ipkg = "deptycheck.ipkg"
test = "tests/tests.ipkg"

[custom.all.docs]
type = "local"
path = "docs"
ipkg = "docs.ipkg"

